<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="calGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052D4" />
      <stop offset="50%" stop-color="#00A859" />
      <stop offset="100%" stop-color="#8BC34A" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB75E" />
      <stop offset="100%" stop-color="#ED8F03" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Calendar Base (Gradient) -->
  <rect x="60" y="120" width="392" height="272" rx="48" fill="url(#calGrad)" />
  
  <!-- Calendar White Inner -->
  <path d="M 60 200 L 452 200 L 452 320 Q 356 340 256 380 Q 156 340 60 320 Z" fill="#ffffff" />
  
  <!-- Rings -->
  <rect x="130" y="70" width="36" height="80" rx="18" fill="#555555" />
  <rect x="346" y="70" width="36" height="80" rx="18" fill="#555555" />
  
  <!-- Map Pin -->
  <path d="M256 140 c -60 0 -110 50 -110 110 c 0 85 110 210 110 210 s 110 -125 110 -210 c 0 -60 -50 -110 -110 -110 z" fill="url(#pinGrad)" filter="url(#shadow)" />
  
  <!-- Star -->
  <polygon points="256,180 268,215 305,215 275,238 286,273 256,250 226,273 237,238 207,215 244,215" fill="#ffffff" />
</svg>
